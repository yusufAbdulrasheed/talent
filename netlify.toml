[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "TRAINING_FEE_NGN,RECRUITER_SUB_INTERMEDIATE_NGN,RECRUITER_SUB_SENIOR_NGN,CLIENT_URL,PAYSTACK_CALLBACK_URL"

[functions]
  directory = "server/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "express",
    "mongoose",
    "serverless-http",
    "cors",
    "helmet",
    "morgan",
    "cookie-parser",
    "multer",
    "jsonwebtoken",
    "bcryptjs",
    "express-rate-limit",
    "resend",
    "zod",
    "cloudinary",
    "dotenv",
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
